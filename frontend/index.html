  <!-- WebMCP Agent Integration — Smart Link v2.5 (Comprehensive Multi-Context & Declarative Support) -->
  <script>
    (function () {
      const API_BASE = 'https://smartlink-api-kou9.onrender.com';

      // Try to get the logged-in user's JWT for authenticated tool calls
      function getAuthHeaders() {
        try {
          const token = localStorage.getItem('token');
          const headers = { 'Content-Type': 'application/json' };
          if (token) headers['Authorization'] = `Bearer ${token}`;
          return headers;
        } catch {
          return { 'Content-Type': 'application/json' };
        }
      }

      // Tool 1: create_marketing_link Schema
      const createMarketingSchema = {
        type: 'object',
        properties: {
          url: {
            type: 'string',
            description: 'Main destination URL. Required unless using A/B testing (abVariants).'
          },
          title: {
            type: 'string',
            description: 'A descriptive name for this link (e.g., "Back to School - Facebook Campaign")'
          },
          utmSource: {
            type: 'string',
            description: 'UTM source parameter (e.g., "facebook", "google", "newsletter")'
          },
          utmMedium: {
            type: 'string',
            description: 'UTM medium parameter (e.g., "cpc", "email", "social")'
          },
          utmCampaign: {
            type: 'string',
            description: 'UTM campaign name (e.g., "back-to-school-2026", "summer-sale")'
          },
          geoRules: {
            type: 'array',
            description: 'Geo-targeting rules: route users from specific countries to different URLs.',
            items: {
              type: 'object',
              properties: {
                countries: {
                  type: 'array',
                  items: { type: 'string' },
                  description: 'ISO 3166-1 alpha-2 country codes (e.g., ["SA", "AE"] for Saudi Arabia and UAE)'
                },
                targetUrl: {
                  type: 'string',
                  description: 'The URL to redirect users from these countries to'
                }
              },
              required: ['countries', 'targetUrl']
            }
          },
          deviceRules: {
            type: 'object',
            description: 'Device-based routing. Route mobile users to one URL and desktop users to another.',
            properties: {
              mobile: { type: 'string', description: 'URL for mobile device users' },
              desktop: { type: 'string', description: 'URL for desktop users' },
              tablet: { type: 'string', description: 'URL for tablet users' }
            }
          },
          languageRules: {
            type: 'array',
            description: 'Language-based routing using browser language settings.',
            items: {
              type: 'object',
              properties: {
                language: { type: 'string', description: 'ISO 639-1 language code (e.g., "ar", "fr", "es")' },
                targetUrl: { type: 'string', description: 'URL to show users whose browser language matches' }
              }
            }
          },
          abVariants: {
            type: 'array',
            description: 'A/B test variants. Provide 2+ URLs to split traffic and find the best-performing one.',
            items: {
              type: 'object',
              properties: {
                url: { type: 'string', description: 'Destination URL for this variant' },
                name: { type: 'string', description: 'Name for this variant (e.g., "Version A - Red Button")' },
                weight: { type: 'number', description: 'Traffic percentage for this variant (e.g., 50 for 50%)' }
              },
              required: ['url']
            }
          },
          enableBotProtection: {
            type: 'boolean',
            description: 'Enable automatic bot detection to block scrapers and fake ad clicks. Recommended for paid ad campaigns.'
          },
          customAlias: {
            type: 'string',
            description: 'Custom short code (e.g., "summer26" → by-smartlink.com/summer26). Must be 3-50 alphanumeric characters.'
          }
        }
      };

      // Tool 2: get_link_analytics Schema
      const analyticsSchema = {
        type: 'object',
        properties: {
          shortCode: {
            type: 'string',
            description: 'The short code of the link (the part after by-smartlink.com/, e.g., "abc123")'
          }
        },
        required: ['shortCode']
      };

      // Tool 3: shorten_url Schema
      const shortenSchema = {
        type: 'object',
        properties: {
          url: {
            type: 'string',
            description: 'The full URL to shorten (must start with http:// or https://)'
          }
        },
        required: ['url']
      };

      const tools = [
        {
          name: 'create_marketing_link',
          description: 'Create a powerful, fully-configured Smart Link for marketing campaigns. Supports geo-targeting, device routing, UTM parameters, A/B testing, and bot protection.',
          inputSchema: createMarketingSchema,
          parameters: createMarketingSchema,
          execute: async (params) => {
            try {
              const response = await fetch(`${API_BASE}/api/public/create-smart-link`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify(params)
              });
              const data = await response.json();
              if (!response.ok) {
                return { success: false, error: data.error || 'Failed to create link', message: data.message || '' };
              }
              return {
                success: true,
                shortUrl: data.shortUrl,
                shortCode: data.shortCode,
                title: data.title,
                featuresEnabled: data.features,
                dashboardUrl: data.dashboardUrl,
                message: data.message
              };
            } catch (err) {
              return { success: false, error: 'Network error', message: err.message };
            }
          }
        },
        {
          name: 'get_link_analytics',
          description: 'Get detailed analytics for a Smart Link: total clicks, bot clicks blocked, top countries, device breakdown, and A/B test results.',
          inputSchema: analyticsSchema,
          parameters: analyticsSchema,
          execute: async ({ shortCode }) => {
            try {
              const response = await fetch(`${API_BASE}/api/public/stats/${shortCode}`);
              const data = await response.json();
              if (!response.ok) {
                return { success: false, error: data.error || 'Link not found' };
              }
              return {
                success: true,
                shortUrl: data.shortUrl,
                title: data.title,
                totalClicks: data.totalClicks,
                humanClicks: data.humanClicks,
                botClicksBlocked: data.botClicksBlocked,
                topCountries: data.topCountries,
                deviceBreakdown: data.deviceBreakdown,
                abTestResults: data.abTestResults,
                message: data.message
              };
            } catch (err) {
              return { success: false, error: 'Network error', message: err.message };
            }
          }
        },
        {
          name: 'shorten_url',
          description: 'Instantly shorten any long URL to a compact Smart Link. No account required.',
          inputSchema: shortenSchema,
          parameters: shortenSchema,
          execute: async ({ url }) => {
            try {
              const response = await fetch(`${API_BASE}/api/public/shorten`, {
                method: 'POST',
                headers: getAuthHeaders(),
                body: JSON.stringify({ originalUrl: url })
              });
              const data = await response.json();
              if (!response.ok) {
                return { success: false, error: data.error || 'Failed to shorten URL', message: data.message || '' };
              }
              return {
                success: true,
                shortUrl: `https://www.by-smartlink.com/${data.shortCode}`,
                shortCode: data.shortCode,
                originalUrl: data.originalUrl,
                message: `Short link ready: https://www.by-smartlink.com/${data.shortCode}`
              };
            } catch (err) {
              return { success: false, error: 'Network error', message: err.message };
            }
          }
        }
      ];

      const registeredContexts = new Set();

      const registerWebMCP = () => {
        const contexts = [
          (typeof navigator !== 'undefined' && navigator.modelContext) ? { obj: navigator.modelContext, name: 'navigator.modelContext' } : null,
          (typeof document !== 'undefined' && document.modelContext) ? { obj: document.modelContext, name: 'document.modelContext' } : null,
          (typeof window !== 'undefined' && window.modelContext) ? { obj: window.modelContext, name: 'window.modelContext' } : null
        ].filter(Boolean);

        contexts.forEach(({ obj, name }) => {
          if (obj && typeof obj.registerTool === 'function' && !registeredContexts.has(obj)) {
            tools.forEach(t => {
              try {
                obj.registerTool(t);
              } catch (e) {
                console.warn(`WebMCP tool registration note on ${name}:`, e.message);
              }
            });
            registeredContexts.add(obj);
            console.log(`✅ Smart Link: 3 WebMCP tools successfully registered on ${name}`);
          }
        });
      };

      registerWebMCP();
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', registerWebMCP);
      }
      window.addEventListener('load', registerWebMCP);

      // Retry periodically for dynamically injected contexts
      const interval = setInterval(registerWebMCP, 300);
      setTimeout(() => clearInterval(interval), 15000);
    })();
  </script>

<body>
  <!-- Declarative WebMCP Forms for Agent Discovery -->
  <div id="webmcp-declarative-container" style="display:none;" aria-hidden="true">
    <form id="webmcp-form-shorten" toolname="shorten_url" tooldescription="Shorten any URL instantly using Smart Link" action="https://smartlink-api-kou9.onrender.com/api/public/shorten" method="POST">
      <input type="url" name="originalUrl" placeholder="Destination URL to shorten" required />

    <form id="webmcp-form-marketing" toolname="create_marketing_link" tooldescription="Create a marketing tracking link with geo-targeting, UTM, bot protection, and A/B testing" action="https://smartlink-api-kou9.onrender.com/api/public/create-smart-link" method="POST">
      <input type="url" name="url" placeholder="Main URL" required />
      <input type="text" name="title" placeholder="Campaign Title" />
      <input type="text" name="utmSource" placeholder="utm_source" />
      <input type="text" name="utmMedium" placeholder="utm_medium" />
      <input type="text" name="utmCampaign" placeholder="utm_campaign" />
      <input type="checkbox" name="enableBotProtection" value="true" />
      <button type="submit">Create Campaign Link</button>
    </form>
    <form id="webmcp-form-analytics" toolname="get_link_analytics" tooldescription="Get click stats and visitor analytics for a Smart Link shortcode" action="https://smartlink-api-kou9.onrender.com/api/public/stats" method="GET">
      <input type="text" name="shortCode" placeholder="shortCode" required />
      <button type="submit">Get Analytics</button>
    </form>
